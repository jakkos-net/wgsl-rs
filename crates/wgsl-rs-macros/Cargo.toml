[package]
name = "wgsl-rs-macros"
version = "0.1.0-beta.5"
edition = "2024"
description = "Procedural macro support for wgsl-rs: the #[wgsl] module macro."
license = "MIT"
repository = "https://github.com/schell/wgsl-rs"
readme = "../../README.md"
rust-version = "1.87"

[features]
# Historically a `linkage-wgpu` feature here controlled compile-time
# wgpu linkage generation in the proc-macro. Since issue #120, wgpu
# linkage is produced at runtime by the `wgsl-rs-linkage-wgpu` crate;
# the no-op feature has been removed along with this crate's only
# remaining reference to it.
default = ["validation"]
validation = []

[lib]
proc-macro = true
bench = false

[dependencies]
itertools.workspace = true
proc-macro2.workspace = true
snafu.workspace = true
syn.workspace = true
quote.workspace = true
wgsl-rs-ir = { version = "0.1.0-beta.5", path = "../wgsl-rs-ir" }
