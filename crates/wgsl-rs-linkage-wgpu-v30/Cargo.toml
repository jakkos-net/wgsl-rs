[package]
name = "wgsl-rs-linkage-wgpu-v30"
version = "0.1.0-beta.4"
edition = "2024"
description = "wgpu 30 linkage generation for wgsl-rs shader modules: bind group layouts, entry point state, buffer descriptors."
license = "MIT"
repository = "https://github.com/schell/wgsl-rs"
rust-version = "1.87"
keywords = ["wgsl", "wgpu", "shader", "gpu"]
categories = ["graphics", "game-development"]

[features]
# Forward to wgsl-rs's own validation feature, which provides
# `wgsl_rs::validate_wgsl_source` (used by `IrModuleExt::validate`).
# Default-on to match wgsl-rs, where validation has always been a
# default feature.
default = ["validation"]
validation = ["wgsl-rs/validation"]

[dependencies]
snafu.workspace = true
# default-features = false: the crate's own `validation` feature is the
# sole forwarding path, so `--no-default-features` builds stay lean
# (no naga validation, no rayon dispatch runtime).
wgsl-rs = { version = "0.1.0-beta.4", path = "../wgsl-rs", default-features = false }
wgsl-rs-ir = { version = "0.1.0-beta.4", path = "../wgsl-rs-ir" }
wgpu = "30"

[dev-dependencies]
futures = { workspace = true }

[package.metadata.docs.rs]
# Document the wgpu re-export alongside the linkage API.
all-features = true